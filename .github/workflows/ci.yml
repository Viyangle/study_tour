name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build & Test (JaCoCo coverage gate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # -Pci 排除 requires-infra 分组（该分组需要本机 MySQL / Redis）
      - name: Run tests with coverage
        run: mvn -B -ntp -Pci verify

      - name: Coverage summary
        if: always()
        run: |
          echo "## 测试结果" >> $GITHUB_STEP_SUMMARY
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 {im+=$4; ic+=$5; bm+=$6; bc+=$7; lm+=$8; lc+=$9}
              END {
                printf "| 指标 | 已覆盖 | 总数 | 覆盖率 |\n|---|---|---|---|\n";
                printf "| 行 | %d | %d | %.2f%% |\n", lc, lm, (lm? lc*100/lm : 0);
                printf "| 分支 | %d | %d | %.2f%% |\n", bc, bm, (bm? bc*100/bm : 0);
                printf "| 指令 | %d | %d | %.2f%% |\n", ic, im, (im? ic*100/im : 0);
              }' target/site/jacoco/jacoco.csv >> $GITHUB_STEP_SUMMARY
          else
            echo "未生成 JaCoCo 报告" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore
