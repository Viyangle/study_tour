version: 2

updates:
  # Maven 依赖：每周检查一次，最多同时开 5 个 PR，避免噪声
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    # 主版本升级需要人工评估：Spring Boot 4 / JJWT 0.x 跨版本都会改 API。
    # LangChain4j 仍是 beta，版本号跳跃大，统一手动升级并跑全量回归。
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "dev.langchain4j:*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      # Spring 生态一起升级，避免版本错配
      spring:
        patterns:
          - "org.springframework*"
      # 测试相关依赖合并成一个 PR
      test:
        patterns:
          - "org.junit*"
          - "org.mockito*"
          - "org.assertj*"

  # GitHub Actions：每月检查一次
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(ci)"
    # Actions 大版本升级涉及 runner 兼容性，手动评估
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
