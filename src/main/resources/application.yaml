spring:
  application:
    name: study_tour
  # Spring Boot datasource
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/study_tour
    username: root
    password: "123456"
  # Redis
  data:
    redis:
      host: localhost
      port: 6379
  servlet:
    multipart:
      # File upload limits
      max-file-size: 1MB
      max-request-size: 10MB

# MyBatis
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

# Aliyun OSS
aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucketName: springbootweb-mybatis-tlias
    region: cn-beijing

# Transaction and AI logs
logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug
    dev.langchain4j: DEBUG

# langchain4j
langchain4j:
  open-ai:
    chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${OPENAI_API_KEY}
      model-name: qwen-max
      log-requests: true
      log-responses: true

    streaming-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${OPENAI_API_KEY}
      model-name: qwen-max
      log-requests: true
      log-responses: true

    embedding-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1 # http://localhost:11434/v1
      api-key: ${OPENAI_API_KEY} # ollama
      model-name: text-embedding-v1 # qwen3-embedding:4b
      log-requests: true
      log-responses: true
      max-segments-per-batch: 10

  community:
    redis:
      host: localhost
      port: 6379

# HTTPS configuration
server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:ssl/study-tour.p12
    key-store-type: PKCS12
    key-store-password: ${SSL_KEY_STORE_PASSWORD}
    key-alias: study-tour

# JWT
jwt:
  secret: ${JWT_SECRET:your-very-long-and-secure-secret-key-at-least-64-characters-for-hs256}
  expiration: 86400000
  refresh-expiration: 604800000
  header: Authorization
  prefix: "Bearer "

# App custom config
app:
  security:
    enabled: false
  rag:
    embedding:
      # Whether to ingest classpath:content documents on startup
      ingest-enabled: false
      # Whether to split documents before embedding ingest
      splitter-enabled: true
      splitter-max-segment-size: 200
      splitter-max-overlap-size: 20
  https:
    # Enable HTTP(8080) -> HTTPS(8443) redirect
    redirect-enabled: true
    http-port: 8080
  amap:
    key: ${AMAP_KEY:}
    transit-endpoint: https://restapi.amap.com/v5/direction/transit/integrated
    transit-timeout-seconds: 20
    transit-cache-ttl-hours: 24
    transit-sleep-millis: 80
