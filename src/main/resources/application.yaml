spring:
  application:
    name: study_tour
  # 数据库版本管理：V1 为现有结构的基线，V2 起为增量迁移
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    # 存量库第一次启动时标记为已执行 V1，不重复建表
    baseline-on-migrate: true
    baseline-version: "1"
    baseline-description: "baseline from scripts/full_schema.sql"
    validate-on-migrate: true
  # Spring Boot datasource
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接信息统一由环境变量注入，默认值仅供本机开发使用
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:study_tour}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      # File upload limits
      max-file-size: 1MB
      max-request-size: 10MB

# MyBatis
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true

# Aliyun OSS
aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucketName: ${OSS_BUCKET:study-tour-image}
    region: cn-beijing

# Transaction and AI logs
logging:
  charset:
    console: UTF-8
    file: UTF-8
  pattern:
    # traceId 由 TraceIdFilter 写入 MDC，便于把一次请求的多行日志串起来
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug
    dev.langchain4j: INFO

# langchain4j
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com # http://localhost:11434/v1
      api-key: ${CHAT_MODEL_KEY} # ollama
      model-name: deepseek-flash # qwen3.6:35b
      temperature: 0
      max-tokens: 2048
      response-format: json_object
      # Ollama OpenAI-compatible API: prevent Qwen thinking tokens from consuming
      # max-tokens and leaving choices[0].message.content empty.
      reasoning-effort: ${CHAT_REASONING_EFFORT:none}
      log-requests: false
      log-responses: false
      timeout: 300s
      max-retries: 1

    embedding-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1 # http://localhost:11434/v1
      api-key: ${EMBEDDING_MODEL_KEY} # ollama
      model-name: qwen3.7-text-embedding # qwen3-embedding:4b
      log-requests: false
      log-responses: false
      max-segments-per-batch: 10

  community:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Use project-scoped vector index settings to avoid default-index collisions
      index-name: study-tour-embedding-index
      prefix: "study-tour:embedding:"
      # Must match the embedding model output dimension
      dimension: 1536
      metadata-keys:
        - doc_type
        - poi_id
        - poiId
        - name
        - tag
        - tags
        - citycode
        - cityname
        - adcode
        - adname
        - typecode
        - source_file

# HTTPS configuration
server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:ssl/study-tour.p12
    key-store-type: PKCS12
    key-store-password: ${SSL_KEY_STORE_PASSWORD}
    key-alias: study-tour

# JWT
jwt:
  secret: ${JWT_SECRET:your-very-long-and-secure-secret-key-at-least-64-characters-for-hs256}
  expiration: 86400000
  refresh-expiration: 2592000000
  header: Authorization
  prefix: "Bearer "

# App custom config
app:
  ai:
    # 当使用 Ollama 时设为 true，将使用不带 function calling 的 OllamaRouteComposerService
    # 注意：开启后需要同时将 langchain4j.open-ai.chat-model 指向 Ollama 地址
    ollama-enabled: false
    # Qwen 路线 JSON 任务不需要思维链；Ollama 模式会在提示词末尾追加 /no_think
    ollama-disable-thinking: true
  security:
    enabled: true
  # 景点 15 维标签向量；enabled=false 时推荐/召回仍走旧的标签名精确匹配
  tag-vector:
    enabled: true
    # 新景点/历史景点自动打分：LLM 优先，失败回退关键词规则
    auto-label-enabled: true
    # 单次 LLM 打分等待上限，超时后回退规则
    label-timeout-seconds: 25
    # 低于该分数的维度不落库，过滤 LLM 的弱相关噪声
    min-prior-weight: 0.4
    # 模型 tagVector 在路线最终向量中的权重，其余来自站点聚合
    route-model-weight: 0.3
    # 启动时是否补标没有 LLM_V2/RULE 权重的景点
    auto-backfill-enabled: true
    # 每次补标最多处理多少个景点，避免首次启动长时间占用后台线程
    backfill-batch-size: 50
    # 反馈闭环：服务端动作/前端事件 → tag_feedback_event → 定时更新 pos/neg
    feedback-enabled: true
    # 默认只采集事件，不自动应用；验证有效后再打开
    apply-enabled: false
    apply-interval-ms: 30000
    apply-batch-size: 100
    # 过期 PENDING 事件不再应用；避免关闭 apply 一段时间后集中重放旧数据
    max-event-age-days: 7
    # 标签向量定时刷新，兜底 reload 失败/进程在 reload 前退出
    refresh-interval-ms: 300000
    # 路线会话 TTL 与上限；Redis 可用时会话持久化，否则退化为进程内存储
    session-ttl-hours: 168
    max-sessions: 10000
    session-cleanup-interval-ms: 600000
    expire-interval-ms: 3600000
    # 向量模式下图谱只收 effective_weight >= 该阈值的标签边
    min-graph-weight: 0.5
    # 反馈 2.0：语义先验 / 学习层 / 会话偏好分离
    serve-mode: PRIOR_ONLY
    learned-write-enabled: true
    learned-max-weight: 0.3
    support-shrink-kappa: 5.0
    learned-prior-pseudo-count: 3.0
    affinity-alpha: 0.2
    popularity-window-days: 30
    popularity-refresh-ms: 300000
    impression-retention-days: 180
    impression-cleanup-interval-ms: 86400000
    ranking-model-refresh-ms: 300000
    ranking:
      prior-match-weight: 0.45
      learned-match-weight: 0.20
      popularity-weight: 0.15
      session-match-weight: 0.15
      user-match-weight: 0.10
      quality-weight: 0.05
      distance-weight: -0.10
    pos-half-life-days: 90
    neg-half-life-days: 180
    user-cap-30d: 0.8
  # 路线规划 Agent 接口（/routes/agent/runs）运行限制，详见 docs/API.md 第 8 节
  agent:
    # 单轮整体执行时间上限
    execution-timeout: 240s
    # 任务保留时间；终态任务按请求触发清理，运行中任务不清理
    run-ttl: 30m
    # 保存任务上限
    max-stored-runs: 500
    # 全局活跃任务上限
    max-active-runs: 8
    # 单账号新建频率窗口与上限；幂等重复不占额度
    create-window: 60s
    max-creates-per-window: 6
    # 每次查询最多返回的事件条数
    max-events: 110
    # 后台执行线程数
    worker-threads: 4
    # 模型自主选择工具；交互轮数与工具调用总数按整轮累计
    max-model-turns: ${AGENT_MAX_MODEL_TURNS:16}
    max-tool-calls: ${AGENT_MAX_TOOL_CALLS:48}
    # 单轮最多发起的高德路径规划请求数
    max-direction-requests: 90
    sweep-interval: 1m
  rag:
    embedding:
      # Whether to ingest classpath:content documents on startup
      ingest-enabled: false
      # Whether to clear the configured Redis embedding index before ingest
      clear-before-ingest: false
      # 是否创建 RedisEmbeddingStore（需要 Redis Stack / RediSearch）。
      # 生产开启 true 后，syncFromAmap/optimize 会把新景点同时写入 MySQL 和 Redis 向量索引。
      store-enabled: true
      # 单景点同步时是否增量写入 Redis 向量索引（依赖 store-enabled=true）
      sync-vector-enabled: true
      # AMap JSON files to convert into RAG documents
      content-pattern: "classpath*:content/*.json"
      # Whether to split documents before embedding ingest
      splitter-enabled: true
      splitter-max-segment-size: 1000
      splitter-max-overlap-size: 20
      min-score: 0.4
      max-results: 30
  # 景点研学讲解：单景点同步立即更新，批量脚本通过定时扫描兜底
  guide:
    enabled: true
    # 配置了 CHAT_MODEL_KEY 时用模型加工知识点/思考题；失败或无 Key 时使用保守模板
    ai-enabled: true
    ai-timeout-seconds: 45
    scheduled-sync-enabled: true
    # 启动后延迟 5 分钟开始扫描，之后每 6 小时处理一批
    initial-delay-ms: 300000
    sync-interval-ms: 21600000
    backfill-batch-size: 50
    batch-pause-ms: 200
    # 已同步内容超过该天数会重新抓取来源
    refresh-days: 30
    sources:
      # 国内可直连的 MediaWiki 开放内容源（CC BY-SA 4.0），默认第一优先
      qiuwen-endpoint: https://www.qiuwenbaike.cn/api.php
      # 中国大陆服务器通常无法直连维基百科；海外部署可打开作为第二来源
      wikipedia-enabled: false
      wikipedia-endpoint: https://zh.wikipedia.org/w/api.php
      timeout-seconds: 12
      request-interval-ms: 150
      # 百度百科旧接口缺少可核实的现行开放授权，默认关闭；取得授权后自行配置 APPID
      baidu-enabled: false
      baidu-app-id: ${BAIDU_BAIKE_APP_ID:}
      baidu-endpoint: https://baike.baidu.com/api/openapi/BaikeLemmaCardApi
      # 百度移动页只读取 meta 摘要；适合作为覆盖率补充，生产上线前请确认内容再许可
      baidu-mobile-enabled: ${BAIDU_BAIKE_MOBILE_ENABLED:true}
      baidu-mobile-endpoint: https://wapbaike.baidu.com/item/
  https:
    # Enable HTTP(8080) -> HTTPS(8443) redirect
    redirect-enabled: true
    http-port: 8080
  amap:
    key: ${AMAP_KEY:}
    transit-endpoint: https://restapi.amap.com/v5/direction/transit/integrated
    # Agent 交通段使用的高德路径规划端点
    walking-endpoint: https://restapi.amap.com/v5/direction/walking
    driving-endpoint: https://restapi.amap.com/v5/direction/driving
    # 路径规划：超时、QPS 限速、同路径缓存时间
    direction-timeout-seconds: 10
    direction-qps: 8
    direction-cache-ttl-minutes: 10
    transit-timeout-seconds: 20
    transit-cache-ttl-hours: 24
    transit-sleep-millis: 80
    transit-parallelism: 6
    transit-qps: 8
    transit-max-retries: 1

semantic:
  edge:
    api-key: ${SEMANTIC_EDGE_API_KEY:}
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    batch-size: 10
    sleep-millis: 500

# 可观测性：健康检查与指标；health/info 对外，metrics 需登录
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: 0.0.4
    description: 研学路线规划与组队平台后端

# 接口契约：/v3/api-docs 产出 OpenAPI 3，/swagger-ui.html 提供在线调试
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false
