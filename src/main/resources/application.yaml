spring:
  application:
    name: study_tour
  # 数据库版本管理：V1 为现有结构的基线，V2 起为增量迁移
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    # 存量库第一次启动时标记为已执行 V1，不重复建表
    baseline-on-migrate: true
    baseline-version: "1"
    baseline-description: "baseline from scripts/full_schema.sql"
    validate-on-migrate: true
  # Spring Boot datasource
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接信息统一由环境变量注入，默认值仅供本机开发使用
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:study_tour}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      # File upload limits
      max-file-size: 1MB
      max-request-size: 10MB

# MyBatis
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true

# Aliyun OSS
aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucketName: ${OSS_BUCKET:study-tour-image}
    region: cn-beijing

# Transaction and AI logs
logging:
  charset:
    console: UTF-8
    file: UTF-8
  pattern:
    # traceId 由 TraceIdFilter 写入 MDC，便于把一次请求的多行日志串起来
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug
    dev.langchain4j: INFO

# langchain4j
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com # http://localhost:11434/v1
      api-key: ${CHAT_MODEL_KEY} # ollama
      model-name: deepseek-v4-flash # qwen3.6:35b
      temperature: 0
      max-tokens: 2048
      response-format: json_object
      # Ollama OpenAI-compatible API: prevent Qwen thinking tokens from consuming
      # max-tokens and leaving choices[0].message.content empty.
      reasoning-effort: ${CHAT_REASONING_EFFORT:none}
      log-requests: false
      log-responses: false
      timeout: 300s
      max-retries: 1

    embedding-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1 # http://localhost:11434/v1
      api-key: ${EMBEDDING_MODEL_KEY} # ollama
      model-name: qwen3.7-text-embedding # qwen3-embedding:4b
      log-requests: false
      log-responses: false
      max-segments-per-batch: 10

  community:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Use project-scoped vector index settings to avoid default-index collisions
      index-name: study-tour-embedding-index
      prefix: "study-tour:embedding:"
      # Must match the embedding model output dimension
      dimension: 1536
      metadata-keys:
        - doc_type
        - poi_id
        - poiId
        - name
        - tag
        - tags
        - citycode
        - cityname
        - adcode
        - adname
        - typecode
        - source_file

# HTTPS configuration
server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:ssl/study-tour.p12
    key-store-type: PKCS12
    key-store-password: ${SSL_KEY_STORE_PASSWORD}
    key-alias: study-tour

# JWT
jwt:
  secret: ${JWT_SECRET:your-very-long-and-secure-secret-key-at-least-64-characters-for-hs256}
  expiration: 86400000
  refresh-expiration: 2592000000
  header: Authorization
  prefix: "Bearer "

# App custom config
app:
  ai:
    # 当使用 Ollama 时设为 true，将使用不带 function calling 的 OllamaRouteComposerService
    # 注意：开启后需要同时将 langchain4j.open-ai.chat-model 指向 Ollama 地址
    ollama-enabled: false
    # Qwen 路线 JSON 任务不需要思维链；Ollama 模式会在提示词末尾追加 /no_think
    ollama-disable-thinking: true
  security:
    enabled: true
  # 路线规划 Agent 接口（/routes/agent/runs）运行限制，详见 docs/API.md 第 8 节
  agent:
    # 单轮整体执行时间上限
    execution-timeout: 240s
    # 任务保留时间；终态任务按请求触发清理，运行中任务不清理
    run-ttl: 30m
    # 保存任务上限
    max-stored-runs: 500
    # 全局活跃任务上限
    max-active-runs: 8
    # 单账号新建频率窗口与上限；幂等重复不占额度
    create-window: 60s
    max-creates-per-window: 6
    # 每次查询最多返回的事件条数
    max-events: 110
    # 后台执行线程数
    worker-threads: 4
    # 单轮最多发起的高德路径规划请求数
    max-direction-requests: 90
    sweep-interval: 1m
  rag:
    embedding:
      # Whether to ingest classpath:content documents on startup
      ingest-enabled: false
      # Whether to clear the configured Redis embedding index before ingest
      clear-before-ingest: false
      # 是否创建 RedisEmbeddingStore（需要 Redis Stack / RediSearch）。
      # 生产开启 true 后，syncFromAmap/optimize 会把新景点同时写入 MySQL 和 Redis 向量索引。
      store-enabled: true
      # 单景点同步时是否增量写入 Redis 向量索引（依赖 store-enabled=true）
      sync-vector-enabled: true
      # AMap JSON files to convert into RAG documents
      content-pattern: "classpath*:content/*.json"
      # Whether to split documents before embedding ingest
      splitter-enabled: true
      splitter-max-segment-size: 1000
      splitter-max-overlap-size: 20
      min-score: 0.4
      max-results: 30
  https:
    # Enable HTTP(8080) -> HTTPS(8443) redirect
    redirect-enabled: true
    http-port: 8080
  amap:
    key: ${AMAP_KEY:}
    transit-endpoint: https://restapi.amap.com/v5/direction/transit/integrated
    # Agent 交通段使用的高德路径规划端点
    walking-endpoint: https://restapi.amap.com/v5/direction/walking
    driving-endpoint: https://restapi.amap.com/v5/direction/driving
    # 路径规划：超时、QPS 限速、同路径缓存时间
    direction-timeout-seconds: 10
    direction-qps: 8
    direction-cache-ttl-minutes: 10
    transit-timeout-seconds: 20
    transit-cache-ttl-hours: 24
    transit-sleep-millis: 80
    transit-parallelism: 6
    transit-qps: 8
    transit-max-retries: 1

semantic:
  edge:
    api-key: ${SEMANTIC_EDGE_API_KEY:}
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    batch-size: 10
    sleep-millis: 500

# 可观测性：健康检查与指标；health/info 对外，metrics 需登录
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: 0.0.4
    description: 研学路线规划与组队平台后端

# 接口契约：/v3/api-docs 产出 OpenAPI 3，/swagger-ui.html 提供在线调试
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false
