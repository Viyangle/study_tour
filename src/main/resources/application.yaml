spring:
  application:
    name: study_tour
  # Spring Boot datasource
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/study_tour
    username: root
    password: "123456"
  # Redis
  data:
    redis:
      host: localhost
      port: 6379
  servlet:
    multipart:
      # File upload limits
      max-file-size: 1MB
      max-request-size: 10MB

# MyBatis
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true

# Aliyun OSS
aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucketName: springbootweb-mybatis-tlias
    region: cn-beijing

# Transaction and AI logs
logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug
    dev.langchain4j: INFO

# langchain4j
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com # http://localhost:11434/v1
      api-key: ${CHAT_MODEL_KEY} # ollama
      model-name: deepseek-v4-flash # qwen3.6:35b
      temperature: 0
      max-tokens: 2048
      response-format: json_object
      # Ollama OpenAI-compatible API: prevent Qwen thinking tokens from consuming
      # max-tokens and leaving choices[0].message.content empty.
      reasoning-effort: ${CHAT_REASONING_EFFORT:none}
      log-requests: false
      log-responses: false
      timeout: 300s
      max-retries: 1

    embedding-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1 # http://localhost:11434/v1
      api-key: ${EMBEDDING_MODEL_KEY} # ollama
      model-name: qwen3.7-text-embedding # qwen3-embedding:4b
      log-requests: false
      log-responses: false
      max-segments-per-batch: 10

  community:
    redis:
      host: localhost
      port: 6379
      # Use project-scoped vector index settings to avoid default-index collisions
      index-name: study-tour-embedding-index
      prefix: "study-tour:embedding:"
      # Must match the embedding model output dimension
      dimension: 1536
      metadata-keys:
        - doc_type
        - poi_id
        - poiId
        - name
        - tag
        - tags
        - citycode
        - cityname
        - adcode
        - adname
        - typecode
        - source_file

# HTTPS configuration
server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:ssl/study-tour.p12
    key-store-type: PKCS12
    key-store-password: ${SSL_KEY_STORE_PASSWORD}
    key-alias: study-tour

# JWT
jwt:
  secret: ${JWT_SECRET:your-very-long-and-secure-secret-key-at-least-64-characters-for-hs256}
  expiration: 86400000
  refresh-expiration: 2592000000
  header: Authorization
  prefix: "Bearer "

# App custom config
app:
  ai:
    # 当使用 Ollama 时设为 true，将使用不带 function calling 的 OllamaRouteComposerService
    # 注意：开启后需要同时将 langchain4j.open-ai.chat-model 指向 Ollama 地址
    ollama-enabled: false
    # Qwen 路线 JSON 任务不需要思维链；Ollama 模式会在提示词末尾追加 /no_think
    ollama-disable-thinking: true
  security:
    enabled: true
  rag:
    embedding:
      # Whether to ingest classpath:content documents on startup
      ingest-enabled: false
      # Whether to clear the configured Redis embedding index before ingest
      clear-before-ingest: false
      # 是否创建 RedisEmbeddingStore（需要 Redis Stack / RediSearch）。
      # 生产开启 true 后，syncFromAmap/optimize 会把新景点同时写入 MySQL 和 Redis 向量索引。
      store-enabled: true
      # 单景点同步时是否增量写入 Redis 向量索引（依赖 store-enabled=true）
      sync-vector-enabled: true
      # AMap JSON files to convert into RAG documents
      content-pattern: "classpath*:content/*.json"
      # Whether to split documents before embedding ingest
      splitter-enabled: true
      splitter-max-segment-size: 1000
      splitter-max-overlap-size: 20
      min-score: 0.4
      max-results: 30
  https:
    # Enable HTTP(8080) -> HTTPS(8443) redirect
    redirect-enabled: true
    http-port: 8080
  amap:
    key: ${AMAP_KEY:}
    transit-endpoint: https://restapi.amap.com/v5/direction/transit/integrated
    transit-timeout-seconds: 20
    transit-cache-ttl-hours: 24
    transit-sleep-millis: 80
    transit-parallelism: 6
    transit-qps: 8
    transit-max-retries: 1

semantic:
  edge:
    api-key: ${SEMANTIC_EDGE_API_KEY:}
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    batch-size: 10
    sleep-millis: 500